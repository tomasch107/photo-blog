<main class="hero" *ngIf="(page$ | async)?.data as pages">
  <ng-container *ngIf="pages[0] as page">
    <div class="hero__overlay" aria-hidden="true"></div>
    <div class="hero__orbit hero__orbit--one" aria-hidden="true"></div>
    <div class="hero__orbit hero__orbit--two" aria-hidden="true"></div>

    <div class="hero__inner">
      <div class="hero__content">
        <p class="eyebrow hero__eyebrow">{{ heroEyebrow }}</p>

        <h1 class="hero__title display-title">{{ page.pageData?.title }}</h1>

        <div class="hero__actions">
          <a [routerLink]="['/categories', 'all']" class="button hero__cta">
            <span>{{ page.pageData?.buttonText }}</span>
            <span class="button__icon" aria-hidden="true">↗</span>
          </a>
          <span class="hero__caption">{{ heroCaption }}</span>
        </div>
      </div>

      <div class="hero__footer">
        <div class="hero__meta">
          <span *ngFor="let subject of heroMeta">{{ subject }}</span>
        </div>

        <div class="hero__scroll" aria-hidden="true">
          <span class="hero__scroll-line"></span>
          <span class="hero__scroll-label">{{ scrollLabel }}</span>
        </div>
      </div>
    </div>
  </ng-container>
</main>
