<section class="gallery-page">
  <header class="gallery-header">
    <p class="eyebrow">{{ collectionLabel }}</p>

    <div class="gallery-heading">
      <h1 class="display-title" *ngIf="categoryName">{{ categoryName }}</h1>
      <span class="pill gallery-count" *ngIf="totalCount">
        {{ totalCount }} {{ getFramesLabel(totalCount) }}
      </span>
    </div>
  </header>

  <div class="gallery-skeleton" *ngIf="loading && posts.length === 0" aria-hidden="true">
    <span class="skeleton-card" *ngFor="let item of skeletonItems"></span>
  </div>

  <ul
    class="gallery-grid"
    *ngIf="posts.length"
    [class.gallery-grid--single]="posts.length === 1"
    [class.gallery-grid--double]="posts.length === 2"
    infiniteScroll
    [infiniteScrollDistance]="1.5"
    [infiniteScrollThrottle]="200"
    [infiniteScrollDisabled]="loading || endOfList"
    (scrolled)="onScroll()">
    <li class="gallery-card" *ngFor="let post of posts; index as i" [class.gallery-card--featured]="i === 0 && posts.length > 2">
      <a class="gallery-card__link" [routerLink]="['/images', post.slug]">
        <div class="gallery-card__media">
          <img [src]="getPostImage(post)" [alt]="post.title" loading="lazy">
        </div>

        <span class="gallery-card__index">{{ i + 1 }}</span>

        <div class="gallery-card__content">
          <div class="gallery-card__heading">
            <h2>{{ post.title }}</h2>
            <span>{{ post.date | date:'yyyy' }}</span>
          </div>
          <span class="gallery-card__cta">{{ viewFrameLabel }} <span aria-hidden="true">↗</span></span>
        </div>
      </a>
    </li>
  </ul>

  <div class="gallery-empty" *ngIf="!loading && !posts.length">
    <span class="gallery-empty__orbit" aria-hidden="true"></span>
    <p>{{ emptyLabel }}</p>
  </div>

  <div class="gallery-footer" *ngIf="posts.length">
    <button
      class="button button--ghost gallery-load-more"
      type="button"
      *ngIf="!endOfList"
      (click)="loadMore()"
      [disabled]="loading">
      {{ loadMoreLabel }}
      <span aria-hidden="true">↓</span>
    </button>
    <span class="gallery-end" *ngIf="endOfList">{{ endLabel }}</span>
  </div>
</section>
