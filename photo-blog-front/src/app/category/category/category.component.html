<main class="gallery-page" id="main" tabindex="-1">
  <a
    class="plate gallery-cover"
    *ngIf="coverPost as newest"
    [routerLink]="['/images', newest.slug]">
    <span class="plate__frame gallery-cover__frame">
      <img [src]="getCoverImage(newest)" [alt]="newest.title">
    </span>
    <span class="plate__caption">
      <span class="plate__title">{{ newest.title }}</span>
      <span class="plate__meta">{{ newest.date | date:'yyyy' }}</span>
    </span>
  </a>

  <header class="gallery-header">
    <h1 class="display-title gallery-title" *ngIf="categoryName">{{ categoryName }}</h1>
    <span class="data-label gallery-count" *ngIf="totalCount">
      {{ totalCount }} {{ getFramesLabel(totalCount) }}
    </span>
  </header>

  <div class="gallery-skeleton" *ngIf="loading && posts.length === 0" aria-hidden="true">
    <span class="skeleton-plate" *ngFor="let item of skeletonItems"></span>
  </div>

  <ul
    class="gallery-grid"
    *ngIf="gridPosts.length"
    infiniteScroll
    [infiniteScrollDistance]="1.5"
    [infiniteScrollThrottle]="200"
    [infiniteScrollDisabled]="loading || endOfList"
    (scrolled)="onScroll()">
    <li *ngFor="let post of gridPosts">
      <a class="plate" [routerLink]="['/images', post.slug]">
        <span class="plate__frame">
          <img [src]="getPostImage(post)" [alt]="post.title" loading="lazy">
        </span>
        <span class="plate__caption">
          <span class="plate__title">{{ post.title }}</span>
          <span class="plate__meta">{{ post.date | date:'yyyy' }}</span>
        </span>
      </a>
    </li>
  </ul>

  <div class="gallery-empty" *ngIf="!loading && !posts.length">
    <p class="gallery-empty__copy">{{ emptyLabel }}</p>
  </div>

  <div class="gallery-footer" *ngIf="posts.length">
    <button
      class="button gallery-load-more"
      type="button"
      *ngIf="!endOfList"
      (click)="loadMore()"
      [disabled]="loading">
      {{ loadMoreLabel }}
      <span class="button__icon" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M8 2.5v11M3.5 9 8 13.5 12.5 9"/></svg>
      </span>
    </button>
    <span class="gallery-end data-label" *ngIf="endOfList">{{ endLabel }}</span>
  </div>
</main>
